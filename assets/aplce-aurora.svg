<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="aurora1" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="35%" stop-color="#7C3AED"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="aurora2" x1="1600" y1="0" x2="0" y2="500">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#334155" stroke-width="0.4" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.35"/>

  <circle cx="1300" cy="60" r="180" fill="#7C3AED" opacity="0.15" filter="url(#blur)">
    <animate attributeName="r" values="170;190;170" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="250" cy="120" r="140" fill="#2563EB" opacity="0.12" filter="url(#blur)">
    <animate attributeName="r" values="130;155;130" dur="7s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 330C160 280 260 370 420 330C560 295 660 250 820 280C980 315 1080 260 1230 300C1360 335 1470 250 1600 290V500H0Z"
        fill="url(#aurora1)" opacity="0.22" filter="url(#blur)">
    <animate attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      values="M0 330C160 280 260 370 420 330C560 295 660 250 820 280C980 315 1080 260 1230 300C1360 335 1470 250 1600 290V500H0Z;
              M0 340C170 250 300 360 460 320C620 280 720 330 850 270C1010 210 1120 320 1260 280C1410 240 1510 300 1600 260V500H0Z;
              M0 330C160 280 260 370 420 330C560 295 660 250 820 280C980 315 1080 260 1230 300C1360 335 1470 250 1600 290V500H0Z"/>
  </path>

  <path d="M0 250C220 180 360 260 520 220C720 170 880 250 1040 210C1200 170 1350 240 1600 180"
        stroke="url(#aurora2)"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.55"
        filter="url(#blur)">
    <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.85">
    <g fill="#A855F7">
      <circle cx="120" cy="60" r="2"/>
      <circle cx="260" cy="110" r="2"/>
      <circle cx="520" cy="70" r="2"/>
      <circle cx="760" cy="140" r="2"/>
      <circle cx="1020" cy="80" r="2"/>
      <circle cx="1310" cy="120" r="2"/>
      <circle cx="1480" cy="90" r="2"/>
    </g>

    <g fill="#38BDF8">
      <circle cx="180" cy="160" r="1.5"/>
      <circle cx="390" cy="120" r="1.5"/>
      <circle cx="690" cy="90" r="1.5"/>
      <circle cx="980" cy="160" r="1.5"/>
      <circle cx="1190" cy="110" r="1.5"/>
      <circle cx="1410" cy="170" r="1.5"/>
    </g>
  </g>

  <g stroke="#60A5FA" stroke-width="1" opacity="0.25">
    <path d="M120 60L260 110L390 120L520 70L690 90L760 140L980 160L1190 110L1310 120L1480 90"/>
  </g>

  <g transform="translate(1180,255)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
             fill="none"
             stroke="url(#aurora1)"
             stroke-width="3"
             filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </polygon>

    <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18"
             fill="url(#aurora2)" opacity="0.35"/>
  </g>

  <text x="110" y="190"
        fill="white"
        font-size="72"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-weight="800"
        letter-spacing="4">
    APLCE
  </text>

  <text x="110" y="245"
        fill="#A78BFA"
        font-size="28"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-weight="600"
        letter-spacing="2">
    Aura Programming Languages &amp; Compiler Engineering
  </text>

  <text x="110" y="295"
        fill="#CBD5E1"
        font-size="20"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        letter-spacing="1">
    Design • Build • Parse • Compile
  </text>

  <text x="110" y="335"
        fill="#94A3B8"
        font-size="18"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    Compiler Engineering • Programming Languages • Web4 Runtime • AI • LLVM • WebAssembly
  </text>

  <g transform="translate(110,390)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="#1E40AF" opacity="0.85"/>
    <text x="60" y="23" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">Compiler</text>

    <rect x="140" y="0" width="130" height="34" rx="17" fill="#6D28D9" opacity="0.85"/>
    <text x="205" y="23" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">Runtime</text>

    <rect x="290" y="0" width="130" height="34" rx="17" fill="#0891B2" opacity="0.85"/>
    <text x="355" y="23" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">Web4</text>

    <rect x="440" y="0" width="150" height="34" rx="17" fill="#16A34A" opacity="0.85"/>
    <text x="515" y="23" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">AI + LLVM</text>
  </g>

  <g opacity="0.3" stroke="#7DD3FC" stroke-width="1.2">
    <path d="M980 410L1130 320L1240 360L1380 300L1490 340"/>
    <circle cx="980" cy="410" r="4" fill="#38BDF8"/>
    <circle cx="1130" cy="320" r="4" fill="#A855F7"/>
    <circle cx="1240" cy="360" r="4" fill="#38BDF8"/>
    <circle cx="1380" cy="300" r="4" fill="#A855F7"/>
    <circle cx="1490" cy="340" r="4" fill="#22C55E"/>
  </g>

  <rect y="480" width="1600" height="20" fill="url(#aurora1)" opacity="0.9"/>
</svg>
