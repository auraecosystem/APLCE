

    <svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="compiler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="web4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

  </defs>

  <rect width="1600" height="500" fill="url(#bg1)"/>

  <g opacity="0.25">
    <path d="M0 320 C250 250 450 380 700 300 C1000 210 1200 330 1600 260 L1600 500 L0 500 Z"
          fill="url(#compiler)">
      <animate attributeName="d"
               dur="12s"
               repeatCount="indefinite"
               values="
M0 320 C250 250 450 380 700 300 C1000 210 1200 330 1600 260 L1600 500 L0 500 Z;
M0 340 C200 230 500 350 760 260 C1050 180 1300 310 1600 230 L1600 500 L0 500 Z;
M0 320 C250 250 450 380 700 300 C1000 210 1200 330 1600 260 L1600 500 L0 500 Z"/>
    </path>
  </g>

  <!-- Rotating Compiler Cube -->
  <g transform="translate(1260 250)">
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40"
             fill="none"
             stroke="#A855F7"
             stroke-width="3">

      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0"
                        to="360 0 0"
                        dur="18s"
                        repeatCount="indefinite"/>
    </polygon>

    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20"
             fill="#38BDF8"
             opacity="0.4"/>
  </g>

  <!-- Orbit -->
  <g transform="translate(1260 250)">
    <circle r="110" stroke="#38BDF8" opacity="0.2" fill="none"/>

    <circle r="6" fill="#A855F7">
      <animateMotion dur="8s"
                     repeatCount="indefinite"
                     path="M110 0 A110 110 0 1 1 -110 0 A110 110 0 1 1 110 0"/>
    </circle>
  </g>

  <!-- Stars -->
  <g fill="#A855F7">
    <circle cx="90" cy="70" r="2"/>
    <circle cx="180" cy="120" r="2"/>
    <circle cx="320" cy="60" r="2"/>
    <circle cx="540" cy="90" r="2"/>
    <circle cx="760" cy="70" r="2"/>
    <circle cx="980" cy="120" r="2"/>
    <circle cx="1480" cy="90" r="2"/>
  </g>

  <!-- Static Title -->
  <text x="110" y="170"
        fill="white"
        font-size="84"
        font-family="Inter,Segoe UI,sans-serif"
        font-weight="800">
    APLCE
  </text>

  <text x="110" y="225"
        fill="#C4B5FD"
        font-size="30"
        font-family="Inter,Segoe UI,sans-serif"
        font-weight="600">
    Aura Programming Languages &amp; Compiler Engineering
  </text>

  <!-- Dynamic Subtitle -->
  <g font-family="Inter,Segoe UI,sans-serif"
     font-size="26"
     font-weight="700">

    <text x="110" y="280" fill="#60A5FA" opacity="1">
      ⚙ Compiler Engineering
      <animate attributeName="opacity"
               values="1;1;0;0;0;0;0;0"
               dur="24s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="280" fill="#A855F7" opacity="0">
      🌍 Programming Languages Encyclopedia
      <animate attributeName="opacity"
               values="0;0;1;1;0;0;0;0"
               dur="24s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="280" fill="#22C55E" opacity="0">
      💜 LMLM Runtime &amp; Virtual Machine
      <animate attributeName="opacity"
               values="0;0;0;0;1;1;0;0"
               dur="24s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="280" fill="#06B6D4" opacity="0">
      🌐 Web4 Runtime &amp; Identity System
      <animate attributeName="opacity"
               values="0;0;0;0;0;0;1;1"
               dur="24s"
               repeatCount="indefinite"/>
    </text>

  </g>

  <!-- Rotating Docs Banner -->
  <g font-family="Inter,Segoe UI,sans-serif"
     font-size="18">

    <text x="110" y="330" fill="#94A3B8" opacity="1">
