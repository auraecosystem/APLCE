      <animate attributeName="opacity"
               values="1;0;0;0;0;0;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/programming-languages/aplce.md
      <animate attributeName="opacity"
               values="0;1;0;0;0;0;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/runtime/lmlm.md
      <animate attributeName="opacity"
               values="0;0;1;0;0;0;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/web4/aplce.md
      <animate attributeName="opacity"
               values="0;0;0;1;0;0;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/ai/gpt5-mini.md
      <animate attributeName="opacity"
               values="0;0;0;0;1;0;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/research/compiler-theory.md
      <animate attributeName="opacity"
               values="0;0;0;0;0;1;0;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/mathematics/aplce.md
      <animate attributeName="opacity"
               values="0;0;0;0;0;0;1;0"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

    <text x="110" y="330" fill="#94A3B8" opacity="0">
      docs/playground/aplce.md
      <animate attributeName="opacity"
               values="0;0;0;0;0;0;0;1"
               dur="32s"
               repeatCount="indefinite"/>
    </text>

  </g>

  <!-- Status Pills -->
  <g font-family="Inter,Segoe UI,sans-serif" font-size="15">

    <rect x="110" y="375" width="140" height="34" rx="17" fill="#1D4ED8"/>
    <text x="180" y="397" fill="white" text-anchor="middle">Compiler</text>

    <rect x="270" y="375" width="120" height="34" rx="17" fill="#6D28D9"/>
    <text x="330" y="397" fill="white" text-anchor="middle">Runtime</text>

    <rect x="410" y="375" width="110" height="34" rx="17" fill="#0891B2"/>
    <text x="465" y="397" fill="white" text-anchor="middle">Web4</text>

    <rect x="540" y="375" width="120" height="34" rx="17" fill="#16A34A"/>
    <text x="600" y="397" fill="white" text-anchor="middle">LLVM</text>

    <rect x="680" y="375" width="150" height="34" rx="17" fill="#EA580C"/>
    <text x="755" y="397" fill="white" text-anchor="middle">AI Compiler</text>

  </g>
<g transform="translate(1240 250)">
  <circle r="90" stroke="#38BDF8" opacity="0.3" fill="none"/>

  <circle r="8" fill="#A855F7">
    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      path="M90 0 A90 90 0 1 1 -90 0 A90 90 0 1 1 90 0"/>
  </circle>

  <polygon
    points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18"
    fill="#06B6D4">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 0 0"
      to="360 0 0"
      dur="10s"
      repeatCount="indefinite"/>
  </polygon>
</g>
  <g transform="translate(800 250)">
  <circle r="60" fill="none" stroke="#7C3AED" stroke-width="4"/>

  <path d="M0-45L40 20L-40 20Z"
        fill="#38BDF8">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 0 0"
      to="-360 0 0"
      dur="20s"
      repeatCount="indefinite"/>
  </path>
</g>
  <g transform="translate(1240 250)">
  <polygon
    points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
    fill="none"
    stroke="url(#aurora)"
    stroke-width="3">

    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 0 0"
      to="360 0 0"
      dur="12s"
      repeatCount="indefinite"/>
  </polygon>
</g>
  <!-- Footer -->
  <rect y="486" width="1600" height="14" fill="url(#web4)"/>

</svg>
