modprobe kvm_intel  # Intel processors

 modprobe kvm_amd    # AMD processors
echo "options kvm-intel nested=1" | sudo tee /etc/modprobe.d/kvm.conf
# For AMD:
# echo "options kvm-amd nested=1" | sudo tee /etc/modprobe.d/kvm.conf
etc/modules-load.d/ or /etc/modules
#
# Load KVM base module
options kvm ignore_msrs=1

# Intel CPU-specific module options
options kvm_intel nested=1 kvmclock_periodic_tsc=0

# AMD CPU-specific module options
options kvm_amd nested=1
